<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы — SoundGoodizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Навбар */
        .navbar {
            background: #2c3e50;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .navbar-brand {
            font-family: 'Roboto Slab', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand span {
            color: #3498db;
        }

        /* Основной контент */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.12);
            padding: 56px 48px;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }

        .icon-wrap {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.35);
        }

        .icon-wrap svg {
            width: 48px;
            height: 48px;
            fill: white;
        }

        .gear {
            animation: spin 6s linear infinite;
            transform-origin: center;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Roboto Slab', serif;
            font-size: 1.9rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .divider {
            width: 56px;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #2c3e50);
            border-radius: 2px;
            margin: 18px auto;
        }

        p {
            font-size: 1rem;
            color: #555;
            line-height: 1.75;
        }

        .badge-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .badge {
            background: #eaf4fd;
            color: #3498db;
            border: 1px solid #bde0f7;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #3498db;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        /* Футер */
        .footer {
            background: #2c3e50;
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 16px;
            font-size: 0.82rem;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="#">
            <span>&#9835;</span> SoundGoodizer
        </a>
    </nav>

    <div class="main">
        <div class="card">
            <div class="icon-wrap">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path class="gear" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.34-1.84c.21-.16.27-.45.13-.69l-2.22-3.87c-.14-.24-.42-.32-.67-.24l-2.76 1.12c-.57-.44-1.18-.81-1.86-1.09L14.11 2.1C14.07 1.84 13.83 1.5 13.5 1.5h-3c-.33 0-.57.34-.61.6l-.38 2.71c-.68.28-1.29.65-1.86 1.09L4.89 4.78c-.25-.08-.53 0-.67.24L2 8.89c-.14.24-.08.53.13.69l2.34 1.84c-.04.34-.07.7-.07 1.08s.03.74.07 1.08L2.13 15.42c-.21.16-.27.45-.13.69l2.22 3.87c.14.24.42.32.67.24l2.76-1.12c.57.44 1.18.81 1.86 1.09l.38 2.71c.04.26.28.6.61.6h3c.33 0 .57-.34.61-.6l.38-2.71c.68-.28 1.29-.65 1.86-1.09l2.76 1.12c.25.08.53 0 .67-.24l2.22-3.87c.14-.24.08-.53-.13-.69l-2.34-1.84z"/>
                </svg>
            </div>

            <h1>Технические работы</h1>
            <div class="divider"></div>
            <p>Сайт временно недоступен — мы работаем<br>над улучшениями и скоро вернёмся.</p>
            <p style="margin-top: 10px; color: #888;">Приносим извинения за неудобства.</p>

            <div class="badge-wrap">
                <div class="badge">Ведутся работы</div>
                <div class="badge">Скоро откроемся</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        © 2026 SoundGoodizer — Покупка, аренда и ремонт музыкальных инструментов
    </footer>

</body>
</html>
