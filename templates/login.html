{% extends "base.html" %}

{% block title %}Вход - SoundGoodizer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="row g-0">
                <div class="col-md-6 d-none d-md-block">
                    <div class="card-body h-100 d-flex align-items-center justify-content-center bg-primary text-white">
                        <div class="text-center p-4">
                            <i class="bi bi-music-note-beamed display-1 mb-3"></i>
                            <h3>SoundGoodizer</h3>
                            <p class="mb-0">Войдите в свой аккаунт</p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2><i class="bi bi-box-arrow-in-right me-2"></i>Вход</h2>
                            <p class="text-muted">Введите свои данные для входа</p>
                        </div>
                        
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="mb-3">
                                <label class="form-label">Логин</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" name="username" 
                                           placeholder="Введите логин" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" name="password" 
                                           placeholder="Введите пароль" required>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Запомнить меня</label>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                                </button>
                            </div>
                        
                        <hr>

                        <div class="text-center">
                            <p class="mb-2">Нет аккаунта?</p>
                            <a href="{{ url_for('register') }}" class="btn btn-outline-primary">
                                <i class="bi bi-person-plus me-2"></i>Зарегистрироваться
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
